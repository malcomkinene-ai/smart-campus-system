<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Student Portal</h2>
            <button onclick="logout()" class="btn btn-outline-danger">Logout</button>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card p-3 shadow-sm">
                    <h5>Enroll in Course</h5>
                    <form id="enrollForm">
                        <input type="number" id="eCourseId" class="form-control mb-2" placeholder="Course ID" required>
                        <button class="btn btn-primary w-100">Enroll</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card p-3 shadow-sm">
                    <h5>My Academic Records</h5>
                    <table class="table table-striped mt-2">
                        <thead>
                            <tr>
                                <th>Course</th>
                                <th>Attendance</th>
                                <th>Coursework</th>
                                <th>Exam</th>
                                <th>Total</th>
                                <th>Grade</th>
                            </tr>
                        </thead>
                        <tbody id="recordsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role !== 'STUDENT') window.location.href = '/index.html';

        function logout() { localStorage.clear(); window.location.href = '/index.html'; }

        async function loadRecords() {
            const resp = await fetch(`/api/student/records/${user.userId}`);
            const data = await resp.json();
            const body = document.getElementById('recordsBody');
            body.innerHTML = '';
            data.forEach(r => {
                body.innerHTML += `
                    <tr>
                        <td>${r.code} - ${r.title}</td>
                        <td>${r.attendance}</td>
                        <td>${r.cw}</td>
                        <td>${r.exam}</td>
                        <td><strong>${r.total}</strong></td>
                        <td><span class="badge bg-secondary">${r.grade}</span></td>
                    </tr>
                `;
            });
        }

        document.getElementById('enrollForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await fetch('/api/student/enroll', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ studentId: user.userId, courseId: parseInt(eCourseId.value) })
            });
            alert('Enrolled Successfully');
            e.target.reset();
            loadRecords();
        });

        loadRecords();
    </script>
</body>
</html>
